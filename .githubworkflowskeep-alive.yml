name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 * * *'   # täglich um 8:00 UTC
  workflow_dispatch:        # erlaubt manuellen Testlauf

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl "https://hewdrcdhuqvahpkkdsjj.supabase.co/rest/v1/sessions?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"