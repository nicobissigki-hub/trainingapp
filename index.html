<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<title>Trainingslog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0d1014; --surface:#161b22; --surface-2:#1d242d; --input:#11161c;
    --line:#2a323d; --line-soft:#212932;
    --text:#e8edf2; --dim:#8b97a6; --faint:#5b6674;
    --warm:#ff7a29; --warm-soft:rgba(255,122,41,.13); --warm-line:rgba(255,122,41,.35);
    --cool:#33c4b2; --cool-soft:rgba(51,196,178,.12); --cool-line:rgba(51,196,178,.35);
    --good:#5ad17f; --danger:#ff5470;
    --r:14px; --rs:10px;
    --disp:'Space Grotesk',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;padding-bottom:40px;
    background-image:radial-gradient(1200px 400px at 80% -10%, rgba(255,122,41,.06), transparent 60%),
                     radial-gradient(1000px 400px at -10% 10%, rgba(51,196,178,.05), transparent 55%)}
  h1,h2,h3{font-family:var(--disp);margin:0;font-weight:700;letter-spacing:-.01em}
  .num{font-family:var(--disp);font-variant-numeric:tabular-nums}
  button{font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:var(--body)}
  input.num-in{font-family:var(--disp);font-variant-numeric:tabular-nums}

  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 18px;
    background:linear-gradient(180deg,rgba(13,16,20,.96),rgba(13,16,20,.82));backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);padding-top:max(14px,env(safe-area-inset-top))}
  .back{width:34px;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);
    display:none;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;transition:.15s}
  .back:active{transform:scale(.94)}
  .brand{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0}
  .brand .t{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.02em}
  .brand .s{font-size:11px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .accent{color:var(--warm)}
  .sync{font-size:10px;color:var(--faint);font-family:var(--disp);letter-spacing:.05em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:6px;padding:3px 7px;flex:0 0 auto}
  .sync.on{color:var(--good);border-color:rgba(90,209,127,.4)}

  .wrap{max-width:640px;margin:0 auto;padding:18px}
  .view{display:none}
  .view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .lede{color:var(--dim);font-size:13px;margin:4px 2px 14px;line-height:1.55}
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:520px){.grid{grid-template-columns:1fr 1fr}}
  .card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 16px 15px;overflow:hidden;transition:.15s;text-align:left;width:100%}
  .card:active{transform:scale(.985)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--warm))}
  .card.cool{--accent:var(--cool)}
  .card h3{font-size:19px;margin-bottom:3px;padding-right:20px}
  .card .desc{font-size:12.5px;color:var(--dim);line-height:1.45}
  .card .meta{font-family:var(--disp);font-size:11px;color:var(--faint);letter-spacing:.05em;
    text-transform:uppercase;margin-top:9px}
  .card .chev{position:absolute;right:14px;top:17px;color:var(--faint);font-size:15px}

  .addcard{border:1px dashed var(--line);background:transparent;border-radius:var(--r);padding:18px;
    text-align:center;color:var(--dim);font-family:var(--disp);font-size:14px;width:100%;transition:.15s}
  .addcard:active{transform:scale(.985);border-color:var(--warm);color:var(--warm)}

  .section-label{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin:24px 4px 12px;display:flex;justify-content:space-between;align-items:center}
  .section-label button{color:var(--dim);font-size:11px;letter-spacing:.05em}

  .s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .s-head h2{font-size:24px}
  .s-sub{color:var(--dim);font-size:13px;margin-top:3px;line-height:1.5}
  .iconbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;
    font-family:var(--disp);font-size:12.5px;color:var(--dim);flex:0 0 auto;transition:.15s}
  .iconbtn:active{transform:scale(.95)}

  .tabs{display:flex;gap:4px;margin:16px 0 4px;background:var(--surface);border:1px solid var(--line);
    border-radius:11px;padding:4px}
  .tab{flex:1;padding:8px;border-radius:8px;font-family:var(--disp);font-size:13px;color:var(--dim);text-align:center;transition:.15s}
  .tab.on{background:var(--surface-2);color:var(--text)}

  .daterow{display:flex;align-items:center;gap:10px;margin:14px 0 2px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--rs);padding:11px 14px}
  .daterow label{font-family:var(--disp);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .daterow input{background:var(--input);border:1px solid var(--line);border-radius:9px;color:var(--text);
    padding:8px 10px;font-size:14px;color-scheme:dark;font-family:var(--disp)}
  .daterow input:focus{outline:none;border-color:var(--warm)}

  .ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 15px 8px;margin:12px 0}
  .ex-name{font-family:var(--disp);font-weight:500;font-size:16px;line-height:1.25}
  .ex-meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--dim);margin:6px 0 2px}
  .ex-meta .m b{color:var(--text);font-family:var(--disp);font-weight:500}
  .ex-cue{font-size:12px;color:var(--warm);margin:5px 0 2px;line-height:1.45}
  .last{font-size:11.5px;color:var(--faint);margin:5px 0 8px}

  .setrow{display:flex;align-items:flex-end;gap:8px;padding:7px 0;border-top:1px solid var(--line-soft)}
  .setno{font-family:var(--disp);font-size:12px;color:var(--faint);width:28px;flex:0 0 auto;padding-bottom:11px}
  .fields{display:flex;gap:7px;flex:1;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
  .field label{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-family:var(--disp);padding-left:2px}
  input.in{background:var(--input);border:1px solid var(--line);border-radius:9px;color:var(--text);
    padding:10px 9px;font-size:15px;width:100%;text-align:center;transition:.15s;min-width:0;
    font-family:var(--disp);font-variant-numeric:tabular-nums}
  input.in:focus{outline:none;border-color:var(--warm);background:#141b22}

  .metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
  .metric{background:var(--input);border:1px solid var(--line);border-radius:var(--rs);padding:11px}
  .metric label{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
    font-family:var(--disp);display:block;margin-bottom:6px}
  .metric input{background:transparent;border:none;color:var(--text);font-size:19px;width:100%;text-align:center;
    font-family:var(--disp);font-variant-numeric:tabular-nums;padding:0}
  .metric input:focus{outline:none}
  .metric.focus{border-color:var(--cool)}

  .checkrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-soft)}
  .checkrow:first-of-type{border-top:none}
  .cbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;transition:.15s;background:var(--input)}
  .cbox.on{background:var(--good);border-color:var(--good)}
  .cbox svg{opacity:0;transform:scale(.5);transition:.15s}
  .cbox.on svg{opacity:1;transform:none}
  .checkrow .cx{flex:1;min-width:0}
  .checkrow .cx .n{font-size:14.5px}

  textarea.note{width:100%;background:var(--input);border:1px solid var(--line);border-radius:11px;color:var(--text);
    font-size:14px;padding:12px;margin-top:12px;resize:vertical;min-height:60px}
  textarea.note:focus{outline:none;border-color:var(--cool)}

  /* Editor */
  .fld{margin-bottom:14px}
  .fld label{display:block;font-family:var(--disp);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);margin-bottom:6px}
  .fld input[type=text], .fld textarea, .fld select{
    width:100%;background:var(--input);border:1px solid var(--line);border-radius:10px;color:var(--text);
    padding:11px 12px;font-size:15px}
  .fld input.small{font-family:var(--disp);text-align:center}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--warm)}
  .fld textarea{min-height:70px;resize:vertical;font-family:var(--body)}
  .fld .hint{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 13px;
    font-family:var(--disp);font-size:13px;color:var(--dim);transition:.15s}
  .chip.on{background:var(--warm-soft);border-color:var(--warm-line);color:var(--warm)}
  .chip.cool.on{background:var(--cool-soft);border-color:var(--cool-line);color:var(--cool)}

  .exitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);
    padding:13px 14px;margin:9px 0;display:flex;align-items:center;gap:12px}
  .exitem .info{flex:1;min-width:0}
  .exitem .nm{font-family:var(--disp);font-weight:500;font-size:15px}
  .exitem .sub{font-size:11.5px;color:var(--faint);margin-top:2px}
  .exitem .ord{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
  .exitem .ord button{font-size:11px;color:var(--faint);padding:2px 6px;border:1px solid var(--line-soft);border-radius:5px;line-height:1.3}
  .exitem .edit{font-size:11.5px;color:var(--dim);padding:6px 10px;border:1px solid var(--line);border-radius:7px;flex:0 0 auto}

  .metricrow{display:flex;gap:8px;align-items:flex-end;margin-bottom:9px}
  .metricrow .f{flex:1;min-width:0}
  .metricrow .f label{display:block;font-family:var(--disp);font-size:9.5px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--faint);margin-bottom:4px}
  .metricrow input{width:100%;background:var(--input);border:1px solid var(--line);border-radius:9px;
    color:var(--text);padding:10px;font-size:14px}
  .metricrow input:focus{outline:none;border-color:var(--cool)}
  .metricrow .del{color:var(--faint);padding:11px 10px;border:1px solid var(--line-soft);border-radius:8px;flex:0 0 auto}
  .metricrow .del:active{color:var(--danger);border-color:var(--danger)}

  .actions{display:flex;gap:10px;margin:22px 0 8px;position:sticky;bottom:14px;z-index:5}
  .btn{flex:1;padding:15px;border-radius:13px;font-family:var(--disp);font-weight:500;font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--warm);color:#1a0e04}
  .btn.primary.cool{background:var(--cool);color:#052420}
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);box-shadow:none}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(255,84,112,.4);box-shadow:none}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:var(--good);color:#04210f;font-family:var(--disp);font-weight:500;font-size:14px;
    padding:12px 20px;border-radius:11px;transition:.25s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--danger);color:#fff}

  .hitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;margin:10px 0}
  .hitem .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .hitem .date{font-family:var(--disp);font-size:13px;color:var(--text)}
  .hitem .del{font-size:11px;color:var(--faint);padding:4px 8px;border-radius:6px;border:1px solid var(--line-soft)}
  .hitem .del:active{color:var(--danger);border-color:var(--danger)}
  .hitem .line{font-size:12.5px;color:var(--dim);padding:2px 0}
  .hitem .line .k{color:var(--faint)}
  .empty{color:var(--faint);font-size:13px;text-align:center;padding:36px 20px;line-height:1.6}
  .foot{color:var(--faint);font-size:11px;text-align:center;margin-top:34px;line-height:1.7}
  .foot button{color:var(--dim);text-decoration:underline;font-size:11px}

  .auth{max-width:380px;margin:8vh auto 0}
  .auth h2{font-size:24px;margin-bottom:4px}
  .auth .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .auth .err{color:var(--danger);font-size:12.5px;margin:8px 2px;min-height:18px}
</style>
</head>
<body>

<div class="topbar">
  <button class="back" id="backBtn" aria-label="Zurück">‹</button>
  <div class="brand">
    <span class="t">TRAININGS<span class="accent">LOG</span></span>
    <span class="s" id="crumb">Übersicht</span>
  </div>
  <span class="sync" id="syncBadge">lokal</span>
</div>

<div class="wrap">
  <div class="view" id="auth">
    <div class="auth">
      <h2>Anmelden</h2>
      <div class="sub">Mit deinem Konto sind Trainings und Daten auf allen Geräten verfügbar.</div>
      <div class="fld"><label>E-Mail</label><input type="text" id="authEmail" autocomplete="email"></div>
      <div class="fld"><label>Passwort</label><input type="text" id="authPass" style="-webkit-text-security:disc" autocomplete="current-password"></div>
      <div class="err" id="authErr"></div>
      <div class="actions" style="position:static">
        <button class="btn primary" onclick="doLogin()">Anmelden</button>
        <button class="btn ghost" onclick="doRegister()">Registrieren</button>
      </div>
    </div>
  </div>

  <div class="view" id="home"></div>
  <div class="view" id="session"></div>
  <div class="view" id="editor"></div>
</div>

<div class="toast" id="toast">Gespeichert ✓</div>

<script>
/* ================================================================
   SUPABASE — hier eintragen (Dashboard → Settings → API).
   Leer lassen = App läuft lokal (nur dieses Gerät).
   ================================================================ */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

const CLOUD = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = CLOUD ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ============ ERFASSUNGS-TYPEN ============
   sets     = Sätze; pro Satz beliebige Felder (Gewicht, Wdh, Sekunden, RPE ...)
   metrics  = eine Erfassung pro Einheit mit frei definierten Feldern (Bike etc.)
   check    = nur abhaken
*/
const SET_FIELDS = [
  {k:"weight",  label:"Gewicht kg", im:"decimal"},
  {k:"reps",    label:"Wdh",        im:"numeric"},
  {k:"seconds", label:"Sekunden",   im:"numeric"},
  {k:"rpe",     label:"RPE",        im:"decimal"},
  {k:"left",    label:"Links",      im:"decimal"},
  {k:"right",   label:"Rechts",     im:"decimal"}
];
function fieldLabel(k){const f=SET_FIELDS.find(x=>x.k===k);return f?f.label:k}
function fieldIm(k){const f=SET_FIELDS.find(x=>x.k===k);return f?f.im:"decimal"}

/* ============ STORE ============ */
const LKEY_T="log_trainings_v4", LKEY_S="log_sessions_v4";
let TRAININGS=[], SESSIONS=[], USER=null;

function lsGet(k,def){try{return JSON.parse(localStorage.getItem(k))||def}catch(e){return def}}
function lsSet(k,v){localStorage.setItem(k,JSON.stringify(v))}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function fmtDate(iso){const d=new Date(iso+"T00:00");return d.toLocaleDateString('de-CH',{weekday:'short',day:'2-digit',month:'2-digit'})}

async function storeInit(){
  if(!CLOUD){TRAININGS=lsGet(LKEY_T,[]);SESSIONS=lsGet(LKEY_S,[]);return;}
  const {data:{session}}=await sb.auth.getSession();
  USER=session?session.user:null;
  if(USER)await fetchAll();
}
async function fetchAll(){
  const t=await sb.from('trainings').select('*').order('sort',{ascending:true});
  if(t.error){toast('Fehler beim Laden der Trainings',1);console.error(t.error);}
  else TRAININGS=(t.data||[]).map(r=>({id:r.id,name:r.name,description:r.description||'',cat:r.cat||'strength',sort:r.sort||0,exercises:r.exercises||[]}));
  const s=await sb.from('sessions').select('*').order('date',{ascending:false}).order('created_at',{ascending:false});
  if(s.error){toast('Fehler beim Laden der Einträge',1);console.error(s.error);}
  else SESSIONS=(s.data||[]).map(r=>({id:r.id,unit:r.unit,date:r.date,data:r.data}));
}

async function saveTraining(tr){
  if(CLOUD&&USER){
    const payload={user_id:USER.id,name:tr.name,description:tr.description,cat:tr.cat,sort:tr.sort,exercises:tr.exercises};
    if(tr.id&&!tr._new){
      const {error}=await sb.from('trainings').update(payload).eq('id',tr.id);
      if(error){toast('Fehler beim Speichern',1);console.error(error);return false;}
      const i=TRAININGS.findIndex(x=>x.id===tr.id);if(i>=0)TRAININGS[i]={...tr};
    }else{
      const {data,error}=await sb.from('trainings').insert(payload).select().single();
      if(error){toast('Fehler beim Speichern',1);console.error(error);return false;}
      TRAININGS.push({id:data.id,name:data.name,description:data.description||'',cat:data.cat,sort:data.sort,exercises:data.exercises||[]});
    }
  }else{
    if(tr.id&&!tr._new){const i=TRAININGS.findIndex(x=>x.id===tr.id);if(i>=0)TRAININGS[i]={...tr};}
    else{tr.id=uid();delete tr._new;TRAININGS.push({...tr});}
    lsSet(LKEY_T,TRAININGS);
  }
  TRAININGS.sort((a,b)=>(a.sort||0)-(b.sort||0));
  return true;
}
async function deleteTraining(id){
  if(CLOUD&&USER){
    const {error}=await sb.from('trainings').delete().eq('id',id);
    if(error){toast('Fehler beim Löschen',1);return false;}
  }
  TRAININGS=TRAININGS.filter(x=>x.id!==id);
  SESSIONS=SESSIONS.filter(x=>x.unit!==id);
  if(!CLOUD){lsSet(LKEY_T,TRAININGS);lsSet(LKEY_S,SESSIONS);}
  return true;
}
async function addSession(unit,data,date){
  const rec={unit,date:date||todayISO(),data};
  if(CLOUD&&USER){
    const {data:ins,error}=await sb.from('sessions').insert({user_id:USER.id,...rec}).select().single();
    if(error){toast('Fehler beim Speichern',1);console.error(error);return false;}
    SESSIONS.unshift({id:ins.id,unit:ins.unit,date:ins.date,data:ins.data});
  }else{
    SESSIONS.unshift({id:uid(),...rec});lsSet(LKEY_S,SESSIONS);
  }
  SESSIONS.sort((a,b)=>a.date===b.date?0:(a.date<b.date?1:-1));
  return true;
}
async function removeSession(id){
  if(CLOUD&&USER){
    const {error}=await sb.from('sessions').delete().eq('id',id);
    if(error){toast('Fehler beim Löschen',1);return false;}
  }
  SESSIONS=SESSIONS.filter(x=>x.id!==id);
  if(!CLOUD)lsSet(LKEY_S,SESSIONS);
  return true;
}
function trainingById(id){return TRAININGS.find(x=>x.id===id)}
function unitSessions(id){return SESSIONS.filter(x=>x.unit===id)}
function lastSession(id){return unitSessions(id)[0]||null}
/* letzte Werte einer Übung — über alle Trainings hinweg, falls Name identisch */
function lastExData(trId,ex){
  for(const s of SESSIONS){
    if(s.unit===trId&&s.data&&s.data[ex.id])return s.data[ex.id];
  }
  for(const s of SESSIONS){
    const t=trainingById(s.unit);if(!t)continue;
    const match=(t.exercises||[]).find(e=>e.name.toLowerCase()===ex.name.toLowerCase());
    if(match&&s.data&&s.data[match.id])return s.data[match.id];
  }
  return null;
}

function exerciseLogHTML(t,ex){
  const ld=lastExData(t.id,ex);
  let h=`<div class="ex" data-ex="${ex.id}">
    <div class="ex-name">${esc(ex.name)}</div>`;
  const meta=[];
  if(ex.mode==='sets'&&ex.sets)meta.push(`Soll <b>${ex.sets}×${esc(ex.target||'')}</b>`);
  if(ex.rpe)meta.push(`RPE <b>${esc(ex.rpe)}</b>`);
  if(ex.rest)meta.push(`Pause <b>${esc(ex.rest)}</b>`);
  if(meta.length)h+=`<div class="ex-meta">${meta.map(m=>`<span class="m">${m}</span>`).join('')}</div>`;
  if(ex.cue)h+=`<div class="ex-cue">${esc(ex.cue)}</div>`;
  h+=`<div class="last">${lastText(ex,ld)}</div>`;

  if(ex.mode==='check'){
    h+=`<div class="checkrow" style="border-top:none;padding-top:2px">
      <div class="cbox" data-check="1" onclick="this.classList.toggle('on')">${tick()}</div>
      <div class="cx"><div class="n">Erledigt</div></div></div>`;
  }else if(ex.mode==='metrics'){
    h+=`<div class="metricgrid">`;
    (ex.metrics||[]).forEach(m=>{
      h+=`<div class="metric"><label>${esc(m.label)}${m.unit?' '+esc(m.unit):''}</label>
        <input class="num-in" data-metric="${esc(m.k)}" inputmode="decimal" value=""></div>`;
    });
    h+=`</div>`;
  }else{
    const flds=ex.fields&&ex.fields.length?ex.fields:['weight','reps'];
    for(let i=0;i<(ex.sets||1);i++){
      const sd=ld&&ld.sets&&ld.sets[i]?ld.sets[i]:{};
      h+=`<div class="setrow"><span class="setno">S${i+1}</span><div class="fields">`;
      flds.forEach(f=>{
        h+=`<div class="field"><label>${fieldLabel(f)}</label>
          <input class="in" data-f="${f}" inputmode="${fieldIm(f)}" value="${sd[f]!=null?esc(String(sd[f])):''}"></div>`;
      });
      h+=`</div></div>`;
    }
  }
  if(ex.note)h+=`<textarea class="note" data-note="1" placeholder="Notiz (optional)"></textarea>`;
  return h+`</div>`;
}
function lastText(ex,ld){
  if(!ld)return 'Erste Einheit — noch keine Referenz';
  if(ex.mode==='check')return 'Letztes Mal: '+(ld.done?'erledigt':'—');
  if(ex.mode==='metrics'){
    const parts=(ex.metrics||[]).map(m=>{
      const v=ld.metrics?ld.metrics[m.k]:null;
      return (v==null||v==='')?null:`${esc(m.label)} ${esc(String(v))}${m.unit?' '+esc(m.unit):''}`;
    }).filter(Boolean);
    return parts.length?'Letztes Mal: '+parts.join(' · '):'Letztes Mal: —';
  }
  const parts=(ld.sets||[]).filter(Boolean).map(st=>setText(ex,st)).filter(Boolean);
  return parts.length?'Letztes Mal: '+parts.join('  ·  '):'Letztes Mal: —';
}
function setText(ex,st){
  const flds=ex.fields&&ex.fields.length?ex.fields:['weight','reps'];
  const bits=[];
  flds.forEach(f=>{
    const v=st[f];if(v==null||v==='')return;
    if(f==='weight')bits.push(v+'kg');
    else if(f==='reps')bits.push(v+'×');
    else if(f==='seconds')bits.push(v+'s');
    else if(f==='rpe')bits.push('@'+v);
    else bits.push(fieldLabel(f).charAt(0)+v);
  });
  if(!bits.length)return'';
  /* "100kg 3×" → "100kg×3" hübscher machen */
  return bits.join(' ').replace(/kg (\d+)×/,'kg×$1');
}

async function saveSession(){
  const t=trainingById(current);
  const date=(document.getElementById('sessDate')||{}).value||todayISO();
  const data={};
  t.exercises.forEach(ex=>{
    const el=sessEl.querySelector(`.ex[data-ex="${ex.id}"]`);if(!el)return;
    if(ex.mode==='check'){
      data[ex.id]={mode:'check',done:el.querySelector('[data-check]').classList.contains('on')};
    }else if(ex.mode==='metrics'){
      const m={};el.querySelectorAll('[data-metric]').forEach(inp=>{
        const v=inp.value.trim();m[inp.getAttribute('data-metric')]=v===''?null:v;});
      data[ex.id]={mode:'metrics',metrics:m};
    }else{
      const rec={mode:'sets',sets:[]};
      el.querySelectorAll('.setrow').forEach(row=>{
        const st={};let any=false;
        row.querySelectorAll('input[data-f]').forEach(inp=>{
          const v=inp.value.trim();st[inp.getAttribute('data-f')]=v===''?null:v;if(v!=='')any=true;});
        rec.sets.push(any?st:null);
      });
      data[ex.id]=rec;
    }
    const n=el.querySelector('[data-note]');
    if(n&&n.value.trim())data[ex.id].note=n.value.trim();
  });
  if(await addSession(current,data,date)){toast('Gespeichert ✓');goHome();}
}

      else if(d.mode==='metrics')v=(ex.metrics||[]).map(m=>{

      else v=(d.sets||[]).filter(Boolean).map(st=>setText(ex,st)).filter(Boolean).join(' · ');

    }).filter(Boolean).join('')||`<div class="line">—</div>`}
  </div>`).join('');

  if(!confirm('Diesen Eintrag löschen?'))return;
  if(await removeSession(id))renderSession();
}

function exSummary(ex){
  if(ex.mode==='check')return 'nur abhaken';
  if(ex.mode==='metrics')return (ex.metrics||[]).map(m=>m.label).join(' · ')||'keine Felder';
  const f=(ex.fields&&ex.fields.length?ex.fields:['weight','reps']).map(fieldLabel).join(' · ');
  return `${ex.sets||1} Sätze · ${f}`;
}
function setCat(c){readTrainingForm();draft.cat=c;renderEditor()}
function readTrainingForm(){
  const n=document.getElementById('tName'), ds=document.getElementById('tDesc');

}
function moveEx(i,dir){
  readTrainingForm();
  const j=i+dir;if(j<0||j>=draft.exercises.length)return;
  const tmp=draft.exercises[i];draft.exercises[i]=draft.exercises[j];draft.exercises[j]=tmp;
  renderEditor();
}
async function saveDraft(){
  readTrainingForm();
  if(!draft.name.trim()){toast('Titel fehlt',1);return;}
  const wasNew=!!draft._new;
  if(await saveTraining(draft)){
    toast('Training gespeichert ✓');
    const saved=TRAININGS.find(x=>x.name===draft.name)||TRAININGS[TRAININGS.length-1];
    draft=null;
    if(wasNew&&saved)openUnit(saved.id);else if(current)openUnit(current);else goHome();
  }
}
async function removeTraining(){
  if(!confirm('Training samt allen Einträgen löschen?'))return;
  if(await deleteTraining(draft.id)){toast('Gelöscht');draft=null;goHome();}
}

function readExForm(){
  const ex=draftEx.ex, g=id=>document.getElementById(id);
  if(g('eName'))ex.name=g('eName').value;

  if(g('eRest'))ex.rest=g('eRest').value;
  edEl.querySelectorAll('[data-mlabel]').forEach(inp=>{
    const i=+inp.getAttribute('data-mlabel');if(ex.metrics[i])ex.metrics[i].label=inp.value;});
  edEl.querySelectorAll('[data-munit]').forEach(inp=>{
    const i=+inp.getAttribute('data-munit');if(ex.metrics[i])ex.metrics[i].unit=inp.value;});
}
function setMode(m){readExForm();draftEx.ex.mode=m;
  if(m==='metrics'&&!draftEx.ex.metrics.length)draftEx.ex.metrics=[{k:uid(),label:'',unit:''}];
  renderEditor()}
function toggleField(k){
  readExForm();const f=draftEx.ex.fields||[];
  const i=f.indexOf(k);if(i>=0)f.splice(i,1);else f.push(k);
  draftEx.ex.fields=f;renderEditor();
}
function toggleNote(){readExForm();draftEx.ex.note=!draftEx.ex.note;renderEditor()}
function addMetric(){readExForm();draftEx.ex.metrics.push({k:uid(),label:'',unit:''});renderEditor()}
function delMetric(i){readExForm();draftEx.ex.metrics.splice(i,1);renderEditor()}
function saveEx(){
  readExForm();
  const ex=draftEx.ex;
  if(!ex.name.trim()){toast('Titel der Übung fehlt',1);return;}
  if(ex.mode==='sets'&&!(ex.fields||[]).length){toast('Mindestens ein Feld wählen',1);return;}
  if(ex.mode==='metrics'){
    ex.metrics=(ex.metrics||[]).filter(m=>m.label.trim());
    if(!ex.metrics.length){toast('Mindestens einen Wert anlegen',1);return;}
  }
  if(draftEx.idx<0)draft.exercises.push(ex);else draft.exercises[draftEx.idx]=ex;
  draftEx=null;renderEditor();window.scrollTo(0,0);
}
function delEx(){
  if(!confirm('Übung entfernen?'))return;

/* ============ UTIL ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function tick(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#04210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'}
let toastT;
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;
  t.classList.toggle('err',!!err);t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900)}

})();
